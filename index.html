<!DOCTYPE html>
<html lang="en,bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reedcom Network</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 90px; /* Място за долното меню */
            overflow-x: hidden;
        }

        /* 1. Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .user-info {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .connect-wallet-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
            transition: transform 0.2s;
        }

        .connect-wallet-btn:active {
            transform: scale(0.95);
        }

        /* 2. Блок Баланс */
        .balance-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .balance-label {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 44px;
            font-weight: 800;
            color: #00b4db;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.4);
        }

        /* 3. Централна Зона (Монета) */
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin: 20px 0;
        }

        .interactive-coin {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: #131a26;
            border: 4px solid #00b4db;
            box-shadow: 0 0 35px rgba(0, 180, 219, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease;
            user-select: none;
        }

        /* Заместител на вашето лого с лотос */
        .coin-logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00b4db;
            text-align: center;
        }

        .interactive-coin:active {
            transform: scale(0.92);
        }

        /* 4. Блок Енергия */
        .energy-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .energy-text span strong {
            color: #00ffcc;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 100%; /* Променяйте динамично според енергията */
            height: 100%;
            background: linear-gradient(90deg, #00b4db, #00ffcc);
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            transition: width 0.3s ease;
        }

        /* 5. Фиксирано Долно Меню */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #111723;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            width: 20%;
            cursor: pointer;
        }

        .nav-item.active {
            color: #00b4db;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- 1. Top Bar -->
    <div class="top-bar">
        <div class="user-info">👤@username</div>
        <button class="connect-wallet-btn">Свържи Портфейл</button>
    </div>

    <!-- 2. Блок Баланс -->
    <div class="balance-container">
        <div class="balance-label">Твоят Баланс</div>
        <div class="balance-amount">788 REED</div>
    </div>

    <!-- 3. Централна Зона: Интерактивна монета -->
    <div class="coin-container">
        <div class="interactive-coin" id="coin">
            <div class="coin.jpg.jpg">REED<br>COMMUNITY</div>
        </div>
    </div>

    <!-- 4. Блок Енергия -->
    <div class="energy-container">
        <div class="energy-text">
            <span>⚡ Енергия</span>
            <span><strong>1000</strong> / 1000</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="energy-bar"></div>
        </div>
    </div>

    <!-- 5. Фиксирано Долно Меню -->
    <nav class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">⚡</span>
            <span>Кликни</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Задачи</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">👥</span>
            <span>Приятели</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Профил</span>
        </div>
    </nav>

    <script>
        // Прост скрипт за демонстрация на клик ефект
        const coin = document.getElementById('coin');
        coin.addEventListener('click', () => {
            // Тук можете да добавите логиката си за увеличаване на баланса и намаляване на енергията
            console.log('Клик върху монетата');
        });
    </script>
</body>
</html>
