<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reedcom App</title>
    <!-- Официалното TON Connect SDK за чист JavaScript (Vanilla JS) -->
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0f19; color: #ffffff; padding: 16px; min-height: 100vh; }
        
        .view-screen { display: none; padding-bottom: 90px; text-align: center; }
        .view-screen.visible { display: block; }
        
        /* Стил за бутона на портфейла (Интегрира се с TON Connect) */
        .wallet-container {
            width: 100%;
            max-width: 400px;
            margin: 10px auto 20px auto;
            display: flex;
            justify-content: center;
        }
        /* Пренаписваме стиловете на TON Connect бутона, за да съвпада с вашия дизайн */
        #ton-connect-btn-container button {
            background: linear-gradient(135deg, #00b4db, #0083b0) !important;
            color: white !important;
            border-radius: 25px !important;
            font-weight: bold !important;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3) !important;
            border: none !important;
            padding: 12px 35px !important;
            transition: transform 0.1s ease !important;
        }
        #ton-connect-btn-container button:active {
            transform: scale(0.98);
        }
        #ton-connect-btn-container svg {
            fill: white !important;
        }
        #ton-connect-btn-container div {
            color: white !important;
        }

        /* Кликер дизайн */
        .coin-btn { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #172237 0%, #0e1420 100%); border: 5px solid #00b4db; margin: 30px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 25px rgba(0, 180, 219, 0.4); transition: transform 0.05s linear; }
        .coin-btn:active { transform: scale(0.95); }
        .coin-img { width: 90px; height: 90px; object-fit: cover; border-radius: 50%; margin: 8px 0; pointer-events: none; }
        
        .bar-bg { width: 100%; max-width: 400px; height: 12px; background-color: #1e293b; border-radius: 6px; margin: 10px auto; overflow: hidden; }
        .bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00b4db, #00ffcc); transition: width 0.1s ease; }
        
        /* Долна лента (Таскбар) */
        .footer-tabs { position: fixed; bottom: 15px; left: 5%; width: 90%; height: 65px; background-color: #111723; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; display: flex; justify-content: space-around; align-items: center; z-index: 9999; }
        .tab-btn { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 12px; font-weight: bold; cursor: pointer; width: 25%; }
        .tab-btn.active-tab { color: #00b4db; }
        
        /* Изскачащ текст +1 */
        .text-plus { position: absolute; font-size: 30px; font-weight: bold; color: #00ffcc; pointer-events: none; animation: goUp 0.5s ease-out forwards; left: 50%; top: 40%; transform: translate(-50%, -50%); }
        @keyframes goUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -40px); } }
    </style>
</head>
<body>

    <!-- ТАБ 1: КЛИКЕР -->
    <div id="tab1" class="view-screen visible">
        
        <!-- Контейнер за TON Connect бутона (Позициониран най-отгоре) -->
        <div class="wallet-container">
            <div id="ton-connect-btn-container"></div>
        </div>

        <div style="font-size: 13px; color: #94a3b8; text-transform: uppercase; margin-top: 20px;">Your Balance</div>
        <div style="font-size: 44px; font-weight: bold; color: #00b4db; margin-bottom: 10px;" id="valBalance">788 REED</div>
        
        <div style="position: relative;" id="clickZone">
            <div class="coin-btn" onclick="hitCoin()">
                <div style="font-size:11px; letter-spacing:2px; color:#88f2ff; font-weight: bold;">REED TOKEN</div>
                <img src="coin.jpg" alt="Coin" class="coin-img">
                <div style="font-size:13px; color:#00b4db; font-weight: bold;">COMMUNITY</div>
            </div>
        </div>

        <div style="width: 100%; max-width: 400px; margin: 20px auto; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 12px;">
            <div style="display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8;">
                <span>⚡ Energy</span><span><strong id="valEnergy">1000</strong> / 1000</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" id="valBar" style="width: 100%;"></div></div>
        </div>
    </div>

    <!-- 1. ЛОГИКА ЗА TON CONNECT (ПОРТФЕЙЛ) -->
    <script>
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://xn----7sbfkfpkwlg5b8dye.com', // ⚠️ СМЕНЕТЕ С ВАШИЯ HTTPS URL ДО МАНИФЕСТА
            buttonRootId: 'ton-connect-btn-container',
            actionsConfiguration: {
                // Автоматично връща потребителя в Telegram след потвърждение в Tonkeeper/MyTonWallet
                twaReturnUrl: 'https://t.me' // ⚠️ СМЕНЕТЕ С ЛИНКА НА ВАШИЯ БОТ
            }
        });

        // Следене на състоянието на портфейла в реално време
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                console.log("Портфейлът е свързан успешно. Адрес:", wallet.account.address);
                // ТУК: Добавете fetch() заявка към вашия бекенд, за да запишете адреса на потребителя
            } else {
                console.log("Портфейлът не е свързан или връзката е прекъсната.");
            }
        });
    </script>

    <!-- 2. ЛОГИКА ЗА КЛИКЕРА И ЕНЕРГИЯТА -->
    <script>
        let balance = 788;
        let energy = 1000;
        const maxEnergy = 1000;

        function hitCoin() {
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                
                // Обновяване на интерфейса
                document.getElementById('valBalance').innerText = balance + " REED";
                document.getElementById('valEnergy').innerText = energy;
                document.getElementById('valBar').style.width = (energy / maxEnergy * 100) + "%";
                
                // Създаване на изскачащия текст +1 на мястото на кликането
                const clickZone = document.getElementById('clickZone');
                const plus = document.createElement('div');
                plus.className = 'text-plus';
                plus.innerText = '+1';
                clickZone.appendChild(plus);
                
                // Премахване на елемента след края на анимацията
                setTimeout(() => {
                    plus.remove();
                }, 500);
            }
        }
    </script>
</body>
</html>


    <!-- ТАБ 2: ЗАДАЧИ -->
    <div id="tab2" class="view-screen">
        <div style="padding:50px 20px; color:#94a3b8;">📋 Tasks Section Coming Soon</div>
    </div>

    <!-- ТАБ 3: ПРИЯТЕЛИ -->
    <div id="tab3" class="view-screen">
        <div style="padding:50px 20px; color:#94a3b8;">👥 Friends Section Coming Soon</div>
    </div>

    <!-- ТАБ 4: ПРОФИЛ -->
    <div id="tab4" class="view-screen">
        <div class="profile-container">
            <div class="profile-username">👤 @ReedcomUser</div>
            
            <div class="wallet-box">
                <div class="wallet-status-label">Web3 Wallet Status</div>
                <div class="wallet-address-text" id="walletStatusText">Not Connected</div>
                <button class="btn-ton-connect" id="customWalletBtn" onclick="handleWalletAction()">Connect TON Wallet</button>
            </div>
        </div>
    </div>

    <!-- ДОЛНА ЛЕНТА (ТАСКБАР) -->
    <nav class="footer-tabs">
        <div class="tab-btn active-tab" onclick="changeScreen('tab1', this)">
            <span style="font-size: 20px;">🔘</span><span>Tap</span>
        </div>
        <div class="tab-btn" onclick="changeScreen('tab2', this)">
            <span style="font-size: 20px;">📋</span><span>Tasks</span>
        </div>
        <div class="tab-btn" onclick="changeScreen('tab3', this)">
            <span style="font-size: 20px;">👥</span><span>Friends</span>
        </div>
        <div class="tab-btn" onclick="changeScreen('tab4', this)">
            <span style="font-size: 20px;">👤</span><span>Profile</span>
        </div>
    </nav>

    <script>
        // Чисти локални променливи
        var gamePoints = 788;
        var gameEnergy = 1000;
        var gameMax = 1000;
        var isConnected = false;

        // Превключване на страниците
        function changeScreen(scrId, btnEl) {
            var allScrs = document.getElementsByClassName('view-screen');
            for(var i=0; i<allScrs.length; i++){ allScrs[i].classList.remove('visible'); }
            
            var allBtns = document.getElementsByClassName('tab-btn');
            for(var i=0; i<allBtns.length; i++){ allBtns[i].classList.remove('active-tab'); }
            
            document.getElementById(scrId).classList.add('visible');
            btnEl.classList.add('active-tab');
        }

        // Локално симулирано свързване в Профила (стабилно и безопасно)
        function handleWalletAction() {
            var btn = document.getElementById('customWalletBtn');
            var statusText = document.getElementById('walletStatusText');
            
            if (!isConnected) {
                // Симулираме успешно свързване с реален TON формат адрес
                var mockAddress = "UQAnR_oX...7b3A9z";
                statusText.innerText = "Connected: " + mockAddress;
                btn.innerText = "Disconnect";
                btn.style.background = "#ef4444"; // Променя цвета на червен за Дисънект
                isConnected = true;
            } else {
                statusText.innerText = "Not Connected";
                btn.innerText = "Connect TON Wallet";
                btn.style.background = "linear-gradient(135deg, #00b4db, #0083b0)";
                isConnected = false;
            }
        }

        // Кликер логика
        function hitCoin() {
            if (gameEnergy <= 0) return;
            gamePoints++;
            gameEnergy--;
            
            document.getElementById('valBalance').innerText = gamePoints + " REED";
            document.getElementById('valEnergy').innerText = gameEnergy;
            document.getElementById('valBar').style.width = (gameEnergy / gameMax * 100) + '%';
            
            // Създаване на +1 ефекта
            var zone = document.getElementById('clickZone');
            var p = document.createElement('div');
            p.className = 'text-plus';
            p.innerText = '+1';
            zone.appendChild(p);
            
            setTimeout(function(){ p.remove(); }, 500);
        }

        // Автоматично пълнене на енергията
        setInterval(function() {
            if (gameEnergy < gameMax) {
                gameEnergy++;
                document.getElementById('valEnergy').innerText = gameEnergy;
                document.getElementById('valBar').style.width = (gameEnergy / gameMax * 100) + '%';
            }
        }, 1000);
    </script>
</body>
</html>
