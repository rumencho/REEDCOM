<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reedcom App</title>
    <!-- Официалното TON Connect SDK за портфейла -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0f19; color: #ffffff; padding: 16px; min-height: 100vh; padding-bottom: 100px; user-select: none; }
        
        .view-screen { display: none; text-align: center; }
        .view-screen.visible { display: block; }
        
        /* Контейнер за TON Connect */
        .wallet-container {
            width: 100%;
            max-width: 400px;
            margin: 10px auto 20px auto;
            display: flex;
            justify-content: center;
        }
        
        /* Изчистен бутон за портфейла */
        .custom-wallet-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
            border: none;
            padding: 12px 35px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.1s ease;
        }
        .custom-wallet-btn:active { transform: scale(0.98); }

        /* Кликер дизайн */
        .coin-btn { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #172237 0%, #0e1420 100%); border: 5px solid #00b4db; margin: 30px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 25px rgba(0, 180, 219, 0.4); transition: transform 0.05s linear; }
        .coin-btn:active { transform: scale(0.95); }
        .coin-img { width: 90px; height: 90px; object-fit: cover; border-radius: 50%; margin: 8px 0; pointer-events: none; }
        
        /* Енергиен бар */
        .energy-wrapper { width: 100%; max-width: 400px; margin: 20px auto; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 12px; }
        .energy-header { display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8; align-items: center; }
        .energy-label { display: flex; align-items: center; gap: 6px; }
        .energy-icon { color: #f59e0b; font-size: 16px; }
        
        .bar-bg { width: 100%; height: 12px; background-color: #1e293b; border-radius: 6px; margin-top: 10px; overflow: hidden; }
        .bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00b4db, #00ffcc); transition: width 0.1s ease; }
        
        /* Долно меню (Таскбар) */
        .footer-tabs { position: fixed; bottom: 15px; left: 5%; width: 90%; height: 65px; background-color: #111723; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; display: flex; justify-content: space-around; align-items: center; z-index: 9999; }
        .tab-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #64748b; font-size: 12px; font-weight: bold; cursor: pointer; width: 25%; text-decoration: none; gap: 4px; }
        .tab-btn.active-tab { color: #00b4db; }
        .tab-icon { font-size: 20px; }
        
        /* Други екрани */
        .screen-title { font-size: 24px; font-weight: bold; margin-top: 30px; color: #00b4db; }
        .screen-desc { color: #94a3b8; margin-top: 10px; margin-bottom: 20px; }

        /* Изскачащ текст +1 в центъра на clickZone */
        .text-plus { position: absolute; font-size: 32px; font-weight: bold; color: #00ffcc; pointer-events: none; animation: goUp 0.5s ease-out forwards; left: 50%; top: 30%; transform: translate(-50%, -50%); }
        @keyframes goUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -40px); } }
    </style>
</head>
<body>

    <!-- ТАБ 1: КЛИКЕР (TAP) -->
    <div id="screen-tap" class="view-screen visible">
        <div class="wallet-container">
            <!-- Сложих изчистена и директна функция за отваряне -->
            <button class="custom-wallet-btn" onclick="openTonModal()" id="main-wallet-btn">Connect TON Wallet</button>
        </div>

        <div style="font-size: 13px; color: #94a3b8; text-transform: uppercase; margin-top: 20px;">Your Balance</div>
        <div style="font-size: 44px; font-weight: bold; color: #00b4db; margin-bottom: 10px;" id="valBalance">0 REED</div>
        
        <div style="position: relative; width: 100%; max-width: 300px; margin: 0 auto;" id="clickZone">
            <div class="coin-btn" onclick="hitCoin()">
                <div style="font-size:11px; letter-spacing:2px; color:#88f2ff; font-weight: bold;">REED TOKEN</div>
                <img src="https://placehold.co" alt="Coin" class="coin-img" id="coinImg">
                <div style="font-size:13px; color:#00b4db; font-weight: bold;">COMMUNITY</div>
            </div>
        </div>

        <div class="energy-wrapper">
            <div class="energy-header">
                <div class="energy-label">
                    <span class="energy-icon">⚡</span>
                    <span>Energy</span>
                </div>
                <span><strong id="valEnergy">1000</strong> / 1000</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" id="valBar" style="width: 100%;"></div></div>
        </div>
    </div>

    <!-- ТАБ 2: TASKS -->
    <div id="screen-tasks" class="view-screen">
        <div class="screen-title">Tasks</div>
        <div class="screen-desc">Complete tasks to earn more REED tokens!</div>
    </div>

    <!-- ТАБ 3: FRIENDS -->
    <div id="screen-friends" class="view-screen">
        <div class="screen-title">Friends</div>
        <div class="screen-desc">Invite your friends and get bonuses!</div>
    </div>

    <!-- ТАБ 4: PROFILE -->
    <div id="screen-profile" class="view-screen">
        <div class="screen-title">Profile</div>
        <div class="screen-desc">Your Account Information</div>
        <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; max-width: 400px; margin: 0 auto; text-align: left;">
            <p style="margin-bottom: 10px;"><strong>Status:</strong> Active</p>
            <p><strong>TON Wallet:</strong> <span id="profile-wallet-status" style="color: #64748b;">Not Connected</span></p>
        </div>
    </div>

    <!-- ДОЛНО МЕНЮ (ТАСКБАР) -->
    <div class="footer-tabs">
        <div class="tab-btn active-tab" onclick="switchTab('screen-tap', this)">
            <span class="tab-icon">⚡</span>
            <span>Tap</span>
        </div>
        <div class="tab-btn" onclick="switchTab('screen-tasks', this)">
            <span class="tab-icon">📋</span>
            <span>Tasks</span>
        </div>
        <div class="tab-btn" onclick="switchTab('screen-friends', this)">
            <span class="tab-icon">👥</span>
            <span>Friends</span>
        </div>
        <div class="tab-btn" onclick="switchTab('screen-profile', this)">
            <span class="tab-icon">👤</span>
            <span>Profile</span>
        </div>
    </div>

    <!-- ЛОГИКА ЗА ИГРАТА И НАВИГАЦИЯТА -->
    <script>
        function switchTab(screenId, button) {
            const screens = document.querySelectorAll('.view-screen');
            screens.forEach(screen => screen.classList.remove('visible'));
            
            const targetScreen = document.getElementById(screenId);
            if (targetScreen) targetScreen.classList.add('visible');
            
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active-tab'));
            
            if (button) button.classList.add('active-tab');
        }

        let balance = 0;
        let energy = 1000;
        const maxEnergy = 1000;

        const valBalance = document.getElementById('valBalance');
        const valEnergy = document.getElementById('valEnergy');
        const valBar = document.getElementById('valBar');
        const clickZone = document.getElementById('clickZone');

        function hitCoin() {
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                valBalance.innerText = balance + " REED";
                valEnergy.innerText = energy;
                valBar.style.width = (energy / maxEnergy * 100) + "%";
                createPlusOne();
            }
        }

        function createPlusOne() {
            const textPlus = document.createElement('div');
            textPlus.classList.add('text-plus');
            textPlus.innerText = '+1';
            clickZone.appendChild(textPlus);
            setTimeout(() => { textPlus.remove(); }, 500);
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 1;
                valEnergy.innerText = energy;
                valBar.style.width = (energy / maxEnergy * 100) + "%";
            }
        }, 1000);
    </script>

    <!-- ОФИЦИАЛНА СТАБИЛНА ИНТЕГРАЦИЯ НА TON CONNECT -->
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let tonConnectUI = null;

        // Инициализираме веднага щом браузърът зареди обектите
        try {
            tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://github.io'
            });

            // Наблюдаваме промените в състоянието
            tonConnectUI.onStatusChange(wallet => {
                const btn = document.getElementById('main-wallet-btn');
