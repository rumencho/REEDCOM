<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REEDCOM - Claim Coins</title>
    
    <!-- Добавяне на TON Connect SDK през CDN -->
    <script src="https://unpkg.com"></script>
    
    <style>
        /* Примерен стил за бутона за теглене */
        #claim-btn {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        #claim-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Добре дошли в REEDCOM</h1>
    
    <!-- Мястото, където ще се рендерира бутонът за свързване на портфейл -->
    <div id="ton-connect-button"></div>

    <!-- Твоят бутон за прехвърляне на спечелените монети -->
    <button id="claim-btn" disabled onclick="claimRewards()">Изтегли спечелените монети</button>

    <script>
        // 1. Инициализиране на TON Connect UI
        // Замени URL адреса с точния линк към твоя манифест в GitHub Pages
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://github.io',
            buttonRootId: 'ton-connect-button'
        });

        // 2. Следене на състоянието на портфейла (дали е свързан)
        tonConnectUI.onStatusChange(wallet => {
            const claimBtn = document.getElementById('claim-btn');
            if (wallet) {
                console.log('Портфейлът е свързан:', wallet.account.address);
                claimBtn.disabled = false; // Активираме бутона за теглене
            } else {
                console.log('Портфейлът е разкачен');
                claimBtn.disabled = true; // Деактивираме го
            }
        });

        // 3. Функция за изпращане на трансакция (Прехвърляне на монети)
        async function claimRewards() {
            // Сумата на монетите, които играчът трябва да плати/прехвърли
            // Забележка: TON измерва сумите в Нанотони (1 TON = 1,000,000,000 Нанотона)
            // Ако трансакцията е просто заявка към твоя смарт договор:
            
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 360, // Валидност 6 минути
                messages: [
                    {
                        address: "EQ_ТВОЯТ_СМАРТ_ДОГОВОР_ИЛИ_ПОРТФЕЙЛ_ТУК", // Адресът на контракта на монетата ти
                        amount: "10000000", // Например 0.01 TON за такса или трансакция
                        // Ако имаш специфичен payload (data за смарт договора), се слага тук:
                        // payload: "te6ccgEBAQE..." 
                    }
                ]
            };

            try {
                alert("Моля, потвърдете трансакцията в портфейла си.");
                const result = await tonConnectUI.sendTransaction(transaction);
                
                // Ако трансакцията е успешна:
                alert("Успешно прехвърляне! Монетите са изпратени.");
                console.log("Резултат от трансакцията:", result);
                
                // Тук можеш да добавиш логика, която занулява баланса на играча в играта
            } catch (error) {
                alert("Трансакцията беше отказана или възникна грешка.");
                console.error("Грешка при изпращане:", error);
            }
        }
    </script>
</body>
</html>
