<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Reedcom Network</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 120px; 
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        /* Top Bar - Само бутона за портфейл, центриран горе */
        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 35px;
            margin-top: 10px;
        }

        .connect-wallet-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
            width: 85%;
            text-align: center;
        }

        /* МОДАЛЕН ПРОЗОРЕЦ ЗА ПОРТФЕЙЛИ */
        .wallet-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 15, 0.85);
            z-index: 100000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wallet-modal.open {
            display: flex;
        }

        .modal-content {
            background: #111723;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 340px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .close-modal {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
            background: none;
            border: none;
        }

        .wallet-option {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            text-align: left;
        }

        .wallet-logo {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
        }

        .logo-binance { background: #F3BA2F; color: #000000; }
        .logo-okx { background: #ffffff; color: #000000; }
        .logo-gate { background: #E84142; color: #ffffff; }

        .wallet-name {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        /* Блок Баланс */
        .balance-container {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .balance-label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 44px;
            font-weight: 800;
            color: #00b4db;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.4);
        }

        /* Централна Зона: Монета */
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 35px 0;
            position: relative;
            width: 100%;
        }

        .interactive-coin {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #172237 0%, #0e1420 100%);
            border: 5px solid #00b4db;
            box-shadow: 0 0 35px rgba(0, 180, 219, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .interactive-coin:active {
            transform: scale(0.92);
        }

        .coin-icon {
            font-size: 55px;
            margin: 10px 0;
        }

        .coin-text-top {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #88f2ff;
        }

        .coin-text-bottom {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00b4db;
        }

        /* Изскачащ текст +1 */
        .floating-text {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            color: #00ffcc;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.1); }
        }

        /* Блок Енергия */
        .energy-container {
            width: 100%;
            max-width: 400px;
            margin: 25px auto 0 auto;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .energy-text span strong {
            color: #00ffcc;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00b4db, #00ffcc);
            border-radius: 6px;
        }

        /* ТАБОВЕ ПРИ КЛИКАНЕ НА МЕНЮТО */
        .page-screen { display: none; }
        .page-screen.active { display: block; }

        /* ДОЛНО МЕНЮ */
        .bottom-nav {
            position: fixed;
            bottom: 15px; 
            left: 5%;
            width: 90%; 
            height: 65px;
            background-color: #111723;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            width: 25%;
            height: 100%;
            cursor: pointer;
        }

        .nav-item.active {
            color: #00b4db;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- 1. Top Bar -->
    <div class="top-bar" translate="no">
        <button class="connect-wallet-btn" id="wallet-btn">Connect Wallet</button>
    </div>

    <!-- МЕНЮ ЗА ИЗБОР НА ПОРТФЕЙЛ -->
    <div class="wallet-modal" id="wallet-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn">&times;</button>
            <div class="modal-title">Connect Web3 Wallet</div>
            
            <div class="wallet-option" id="opt-binance">
                <div class="wallet-logo logo-binance">BNC</div>
                <div class="wallet-name">Binance Web3</div>
            </div>
            <div class="wallet-option" id="opt-okx">
                <div class="wallet-logo logo-okx">OKX</div>
                <div class="wallet-name">OKX Wallet</div>
            </div>
            <div class="wallet-option" id="opt-gate">
                <div class="wallet-logo logo-gate">GATE</div>
                <div class="wallet-name">Gate.io Wallet</div>
            </div>
        </div>
    </div>

    <!-- ЕКРАН 1: TAP (Основен кликер) -->
    <div id="screen-tap" class="page-screen active">
        <div class="balance-container" translate="no">
            <div class="balance-label">Your Balance</div>
            <div class="balance-amount" id="balance-txt">788 REED</div>
        </div>

        <div class="coin-container" translate="no" id="coin-area">
            <div class="interactive-coin" id="coin-btn">
                <div class="coin-text-top">REED TOKEN</div>
                <div class="coin-icon">🌸</div>
                <div class="coin-text-bottom">COMMUNITY</div>
            </div>
        </div>

        <div class="energy-container" translate="no">
            <div class="energy-text">
                <span>⚡ Energy</span>
