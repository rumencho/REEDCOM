<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reedcom Network</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0b0f19; 
            color: #ffffff; 
            min-height: 100vh; 
            user-select: none; 
            text-align: center;
            padding: 16px;
            padding-bottom: 110px;
            position: relative;
        }
        
        /* Превключване на екрани без JavaScript */
        .page-screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page-screen:target { display: flex; }
        
        /* Първият екран (Tap) е активен при стартиране */
        #screen-tap { display: flex; }
        .page-screen:target ~ #screen-tap { display: none; }
        #screen-tap:target { display: flex; }

        /* Горна лента */
        .top-bar { display: flex; justify-content: center; width: 100%; margin-bottom: 20px; margin-top: 10px; }
        .connect-wallet-btn { background: linear-gradient(135deg, #00b4db, #0083b0); color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; width: 85%; transition: all 0.3s ease; }
        
        /* Баланс */
        .balance-container { text-align: center; margin-bottom: 20px; width: 100%; }
        .balance-label { font-size: 13px; color: #94a3b8; text-transform: uppercase; }
        .balance-amount { font-size: 44px; font-weight: bold; color: #00b4db; margin-top: 5px; }
        
        /* Монета */
        .coin-container { display: flex; justify-content: center; margin: 25px 0; position: relative; width: 100%; }
        .interactive-coin { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #172237 0%, #0e1420 100%); border: 5px solid #00b4db; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 30px rgba(0, 180, 219, 0.4); }
        .interactive-coin:active { transform: scale(0.94); }
        .coin-image { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; margin: 8px 0; pointer-events: none; }
