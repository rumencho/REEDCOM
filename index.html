<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reedcom Network - Clicker</title>
    <style>
        body {
            background-color: #0d121d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-container {
            max-width: 400px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .airdrop-badge {
            background: linear-gradient(135deg, #f3ba2f 0%, #f0a500 100%);
            color: #0d121d;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .balance-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .balance-label {
            font-size: 14px;
            color: #8a99ad;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: #00d2ff;
            margin-top: 5px;
        }
        .clicker-container {
            display: flex;
            justify-content: center;
            margin: 40px 0;
        }
        .coin-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s ease;
        }
        .coin-btn:active {
            transform: scale(0.92);
        }
        .energy-container {
            width: 100%;
            margin-bottom: 25px;
        }
        .energy-bar {
            width: 100%;
            height: 12px;
            background-color: #1c2c3e;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .energy-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00d2ff, #00ffaa);
        }
        .wallet-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
            text-align: center;
        }
        .wallet-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #f3ba2f;
        }
        .wallet-input-container {
            display: flex;
            gap: 8px;
        }
        .wallet-input {
            flex: 1;
            background-color: #16222f;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
        }
        .btn-save {
            background-color: #00d2ff;
            color: #0d121d;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .tasks-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .task-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .task-btn {
            background-color: #1c2c3e;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div style="font-weight: bold; letter-spacing: 1px;">REEDCOM NETWORK</div>
        <div class="airdrop-badge">🎁 AIRDROP PHASE</div>
    </div>

    <div class="balance-container">
        <div class="balance-label">Your Balance</div>
        <div class="balance-amount" id="balanceDisplay">0</div>
    </div>

    <div class="wallet-section">
        <div class="wallet-title">Submit BSC Wallet Address</div>
        <div class="wallet-input-container">
            <input type="text" id="walletInput" class="wallet-input" placeholder="Paste 0x... address">
            <button class="btn-save" onclick="saveAddress()">Save</button>
        </div>
    </div>

     <div class="clicker-container">
        <button class="coin-btn" onclick="handleTap(event)">
            <!-- Задаваме точното име на качения файл coin.jpg.jpg -->
            <img src="coin.jpg.jpg" alt="Reed Coin" style="width: 170px; height: 170px; filter: drop-shadow(0 0 25px rgba(0, 210, 255, 0.8)); border-radius: 50%;">
        </button>
    </div>
    
    <div class="energy-container">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
            <span>⚡ Energy</span>
            <span id="energyText">1000/1000</span>
        </div>
        <div class="energy-bar">
            <div class="energy-fill" id="energyFill"></div>
        </div>
    </div>

    <div class="tasks-container">
        <div style="font-weight: bold; margin-bottom: 10px;">Tasks for Coins</div>
        <div class="task-row">
            <span>Join Telegram</span>
            <a href="https://t.me" target="_blank" class="task-btn" onclick="claimTask(100)">+100 RC</a>
        </div>
    </div>
</div>

<script>
    let score = parseInt(localStorage.getItem("reedcom_score")) || 0;
    let energy = 1000;

    document.getElementById("balanceDisplay").innerText = score;
    document.getElementById("walletInput").value = localStorage.getItem("reedcom_wallet") || "";

    function handleTap() {
        if (energy >= 1) {
            score += 1;
            energy -= 1;
            document.getElementById("balanceDisplay").innerText = score;
            document.getElementById("energyText").innerText = energy + "/1000";
            document.getElementById("energyFill").style.width = (energy / 10) + "%";
            localStorage.setItem("reedcom_score", score);
        }
    }

    setInterval(() => {
        if (energy < 1000) {
            energy += 1;
            document.getElementById("energyText").innerText = energy + "/1000";
            document.getElementById("energyFill").style.width = (energy / 10) + "%";
        }
    }, 1000);

    function claimTask(reward) {
        score += reward;
        document.getElementById("balanceDisplay").innerText = score;
        localStorage.setItem("reedcom_score", score);
    }

    function saveAddress() {
        const address = document.getElementById("walletInput").value.trim();
        if (address === "") {
            alert("Please enter an address!");
            return;
        }
        localStorage.setItem("reedcom_wallet", address);
        alert("Wallet address saved!");
    }
</script>

</body>
</html>
