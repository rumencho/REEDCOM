<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reedcom Network</title>
    
    <!-- 1. ВСИЧКИ ФУНКЦИИ И ЛОГИКА (Най-горе, за да няма блокиране на менюто) -->
    <script>
        // Инициализиране на глобалните променливи веднага
        window.balance = 788;
        window.energy = 1000;
        window.maxEnergy = 1000;

        window.taskState = {
            tg: localStorage.getItem('task_tg_status') || 'new',
            x: localStorage.getItem('task_x_status') || 'new'
        };

        window.updateBalanceDisplays = function() {
            const b1 = document.getElementById('balance-txt');
            const b2 = document.getElementById('tasks-balance-txt');
            if(b1) b1.textContent = window.balance + " REED";
            if(b2) b2.textContent = window.balance + " REED";
        };

        window.renderTasks = function() {
            ['tg', 'x'].forEach(function(type) {
                const btnGo = document.getElementById('btn-go-' + type);
                const btnClaim = document.getElementById('btn-claim-' + type);
                const btnDone = document.getElementById('btn-done-' + type);
                
                if (window.taskState[type] === 'clicked') {
                    if(btnGo) btnGo.style.display = 'none';
                    if(btnClaim) btnClaim.style.display = 'inline-block';
                } else if (window.taskState[type] === 'done') {
                    if(btnGo) btnGo.style.display = 'none';
                    if(btnClaim) btnClaim.style.display = 'none';
                    if(btnDone) btnDone.style.display = 'inline-block';
                }
            });
        };

        window.clickCoin = function(e) {
            if (window.energy > 0) {
                window.balance += 1;
                window.energy -= 1;
                window.updateBalanceDisplays();
                
                const eTxt = document.getElementById('energy-txt');
                const eBar = document.getElementById('energy-bar');
                if(eTxt) eTxt.textContent = window.energy;
                if(eBar) eBar.style.width = (window.energy / 10) + "%";

                // Изскачащ текст +1
                const coinArea = document.getElementById('coin-area');
                if (coinArea) {
                    const float = document.createElement('div');
                    float.className = 'floating-text';
                    float.textContent = '+1';
                    const rect = coinArea.getBoundingClientRect();
                    const touch = e.touches ? e.touches[0] : e;
                    const clickX = touch.clientX ? touch.clientX - rect.left : rect.width / 2;
                    const clickY = touch.clientY ? touch.clientY - rect.top : rect.height / 2;
                    
                    float.style.left = (clickX - 15) + 'px';
                    float.style.top = (clickY - 20) + 'px';
                    coinArea.appendChild(float);
                    setTimeout(function() { float.remove(); }, 600);
                }
            }
        };

        window.startTask = function(type) {
            if (window.taskState[type] === 'new') {
                window.taskState[type] = 'clicked';
                localStorage.setItem('task_' + type + '_status', 'clicked');
                setTimeout(window.renderTasks, 800);
            }
        };

        window.claimTask = function(type, reward) {
            if (window.taskState[type] === 'clicked') {
                window.balance += reward;
                window.taskState[type] = 'done';
                localStorage.setItem('task_' + type + '_status', 'done');
                window.updateBalanceDisplays();
                window.renderTasks();
            }
        };

        window.openWalletModal = function() { 
            const m = document.getElementById('wallet-modal');
            if(m) m.classList.add('open'); 
        };
        
        window.closeWalletModal = function() { 
            const m = document.getElementById('wallet-modal');
            if(m) m.classList.remove('open'); 
        };

        window.selectWallet = function(name, color) {
            window.closeWalletModal();
            const btn = document.getElementById('wallet-btn');
            if(btn) {
                btn.textContent = name + ": 0x7a...2f";
                btn.style.background = color;
            }
        };

        window.switchScreen = function(navId, screenId) {
            document.querySelectorAll('.page-screen').forEach(function(s) { s.classList.remove('active'); });
            document.querySelectorAll('.nav-item').forEach(function(i) { i.classList.remove('active'); });
            
            const scr = document.getElementById(screenId);
            const nv = document.getElementById(navId);
            if(scr) scr.classList.add('active');
            if(nv) nv.classList.add('active');
        };

        // Стартиране на регенерацията и първоначалното рендиране веднага след зареждане на HTML структурата
        document.addEventListener('DOMContentLoaded', function() {
            window.updateBalanceDisplays();
            window.renderTasks();

            setInterval(function() {
                if (window.energy < 1000) {
                    window.energy = Math.min(window.energy + 3, 1000);
                    const eTxt = document.getElementById('energy-txt');
                    const eBar = document.getElementById('energy-bar');
                    if(eTxt) eTxt.textContent = window.energy;
                    if(eBar) eBar.style.width = (window.energy / 10) + "%";
                }
            }, 1000);
        });
    </script>

    <!-- 2. СТИЛОВЕ И ВИЗУАЛИЗАЦИЯ -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0f19; color: #ffffff; padding: 16px; padding-bottom: 120px; min-height: 100vh; user-select: none; overflow-x: hidden; }
        .top-bar { display: flex; justify-content: center; margin-bottom: 30px; }
        .connect-wallet-btn { background: linear-gradient(135deg, #00b4db, #0083b0); color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; width: 85%; text-align: center; }
        .wallet-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 15, 0.9); z-index: 100000; justify-content: center; align-items: center; }
        .wallet-modal.open { display: flex; }
        .modal-content { background: #111723; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; width: 90%; max-width: 340px; padding: 24px; text-align: center; position: relative; }
        .close-modal { position: absolute; top: 16px; right: 16px; font-size: 24px; color: #64748b; background: none; border: none; cursor: pointer; }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        .wallet-option { display: flex; align-items: center; width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; margin-bottom: 12px; cursor: pointer; text-align: left; }
        .wallet-logo { width: 35px; height: 35px; border-radius: 8px; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        .logo-binance { background: #F3BA2F; color: #000; }
        .logo-okx { background: #fff; color: #000; }
        .logo-gate { background: #E84142; color: #fff; }
        .balance-container { text-align: center; margin-bottom: 25px; }
        .balance-label { font-size: 13px; color: #94a3b8; text-transform: uppercase; }
        .balance-amount { font-size: 44px; font-weight: bold; color: #00b4db; }
        
        .coin-container { display: flex; justify-content: center; margin: 30px 0; position: relative; }
        .interactive-coin { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #172237 0%, #0e1420 100%); border: 5px solid #00b4db; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; overflow: hidden; position: relative; box-shadow: 0 0 35px rgba(0, 180, 219, 0.5); transition: transform 0.05s ease; }
        .interactive-coin:active { transform: scale(0.92); }
        .coin-image { width: 90px; height: 90px; object-fit: cover; border-radius: 50%; margin: 8px 0; pointer-events: none; }

        .energy-container { width: 100%; max-width: 400px; margin: 20px auto; background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 12px; }
        .energy-text { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #94a3b8; }
        .progress-bar-bg { width: 100%; height: 12px; background-color: #1e293b; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00b4db, #00ffcc); }
        
        .page-screen { display: none; }
        .page-screen.active { display: block; }
        
        .tasks-container { width: 100%; max-width: 400px; margin: 10px auto; display: flex; flex-direction: column; gap: 14px; }
        .task-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .task-info { display: flex; flex-direction: column; gap: 4px; }
        .task-title { font-size: 15px; font-weight: bold; color: #ffffff; }
        .task-reward { font-size: 13px; color: #00ffcc; font-weight: 600; }
        .task-actions { display: flex; gap: 8px; align-items: center; }
