<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reedcom Network</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0f19; color: #ffffff; padding: 16px; padding-bottom: 120px; min-height: 100vh; user-select: none; }
        
        .top-bar { display: flex; justify-content: center; margin-bottom: 30px; }
        .connect-wallet-btn { background: linear-gradient(135deg, #00b4db, #0083b0); color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; width: 85%; text-align: center; }
        
        .wallet-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 15, 0.9); z-index: 100000; justify-content: center; align-items: center; }
        .wallet-modal.open { display: flex; }
        .modal-content { background: #111723; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; width: 90%; max-width: 340px; padding: 24px; text-align: center; position: relative; }
        .close-modal { position: absolute; top: 16px; right: 16px; font-size: 24px; color: #64748b; background: none; border: none; cursor: pointer; }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        
        .wallet-option { display: flex; align-items: center; width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; margin-bottom: 12px; cursor: pointer; text-align: left; }
        .wallet-logo { width: 35px; height: 35px; border-radius: 8px; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        .logo-binance { background: #F3BA2F; color: #000; }
        .logo-okx { background: #fff; color: #000; }
        .logo-gate { background: #E84142; color: #fff; }
        
        .balance-container { text-align: center; margin-bottom: 25px; }
        .balance-label { font-size: 13px; color: #94a3b8; text-transform: uppercase; }
        .balance-amount { font-size: 44px; font-weight: bold; color: #00b4db; }
        
        .coin-container { display: flex; justify-content: center; margin: 30px 0; position: relative; perspective: 1000px; }
        .interactive-coin { 
            width: 220px; 
            height: 220px; 
            border-radius: 50%; 
            background: radial-gradient(circle, #172237 0%, #0e1420 100%); 
            border: 5px solid #00b4db; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            overflow: hidden; 
            position: relative;
            box-shadow: 0 0 35px rgba(0, 180, 219, 0.5);
            transition: transform 0.05s linear;
        }
        
        .interactive-coin:active { 
            transform: scale(0.92); 
        }
        
        .coin-image { 
            width: 90px; 
            height: 90px; 
            object-fit: cover; 
            border-radius: 50%; 
            margin: 8px 0;
            pointer-events: none;
        }
        
        .energy-container { width: 100%; max-width: 400px; margin: 20px auto; background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 12px; }
        .energy-text { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #94a3b8; }
        .progress-bar-bg { width: 100%; height: 12px; background-color: #1e293b; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00b4db, #00ffcc); }
        
        .page-screen { display: none; }
        .page-screen.active { display: block; }
        
        .bottom-nav { position: fixed; bottom: 15px; left: 5%; width: 90%; height: 65px; background-color: #111723; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; display: flex; justify-content: space-around; align-items: center; z-index: 99999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 12px; font-weight: bold; cursor: pointer; width: 25%; text-align: center; justify-content: center; gap: 4px; }
        .nav-item.active { color: #00b4db; }
        
        .floating-text { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 32px; font-weight: bold; color: #00ffcc; pointer-events: none; animation: floatUp 0.6s ease-out forwards; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -60px); } }
    </style>

    <script>
        // Деклариране на променливите глобално
        let balance = 788;
        let energy = 1000;
        const maxEnergy = 1000;

        // Изчакваме пълното зареждане на страницата, преди да обвържем бутоните
        document.addEventListener("DOMContentLoaded", function() {
            
            // Настройка на Копчето за Портфейл
            const walletBtn = document.getElementById('wallet-btn');
            const walletModal = document.getElementById('wallet-modal');
            const closeModalBtn = document.querySelector('.close-modal');
            
            if(walletBtn) {
                walletBtn.addEventListener('click', function() {
                    walletModal.classList.add('open');
                });
            }
            
            if(closeModalBtn) {
                closeModalBtn.addEventListener('click', function() {
                    walletModal.classList.remove('open');
                });
            }

            // Настройка на избора на Портфейли
            const options = document.querySelectorAll('.wallet-option');
            options.forEach(option => {
                option.addEventListener('click', function() {
                    const walletName = this.querySelector('div:last-child').innerText;
                    if(walletBtn) walletBtn.innerText = walletName + " Connected";
                    walletModal.classList.remove('open');
                });
            });

            // Настройка на Кликъра (Монетата)
            const mainCoin = document.getElementById('main-coin');
            if(mainCoin) {
                mainCoin.addEventListener('click', function() {
                    if (energy <= 0) return;

                    balance += 1;
                    energy -= 1;
                    
                    document.getElementById('balance-txt').innerText = balance + " REED";
                    document.getElementById('energy-txt').innerText = energy;
                    
                    let energyPercentage = (energy / maxEnergy) * 100;
                    document.getElementById('energy-bar').style.width = energyPercentage + '%';

                    // Създаване на изскачащ текст +1
                    const coinArea = document.getElementById('coin-area');
                    const num = document.createElement('div');
                    num.className = 'floating-text';
                    num.innerText = '+1';
                    coinArea.appendChild(num);
                    
                    setTimeout(function() {
                        num.remove();
                    }, 600);
                });
            }

            // Автоматично пълнене на Енергия на всяка секунда
            setInterval(function() {
                if (energy < maxEnergy) {
                    energy += 1;
                    document.getElementById('energy-txt').innerText = energy;
                    let energyPercentage = (energy / maxEnergy) * 100;
                    document.getElementById('energy-bar').style.width = energyPercentage + '%';
                }
            }, 1000);
        });

        // Функция за Таскбара (остава видима директно за улеснение)
        function switchTab(screenId, element) {
            var screens = document.getElementsByClassName('page-screen');
            for (var i = 0; i < screens.length; i++) {
                screens[i].classList.remove('active');
            }
            var items = document.getElementsByClassName('nav-item');
            for (var i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
            }
            document.getElementById(screenId).classList.add('active');
            element.classList.add('active');
        }
    </script>
</head>
<body>

    <div class="top-bar">
        <button class="connect-wallet-btn" id="wallet-btn">Connect Wallet</button>
    </div>

    <div class="wallet-modal" id="wallet-modal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div class="modal-title">Connect Web3 Wallet</div>
            <div class="wallet-option"><div class="wallet-logo logo-binance">BNC</div><div>Binance Web3</div></div>
            <div class="wallet-option"><div class="wallet-logo logo-okx">OKX</div><div>OKX Wallet</div></div>
            <div class="wallet-option"><div class="wallet-logo logo-gate">GATE</div><div>Gate.io Wallet</div></div>
        </div>
    </div>

    <!-- ТАБ 1: КЛИКЕР -->
    <div id="screen-tap" class="page-screen active">
        <div class="balance-container">
            <div class="balance-label">Your Balance</div>
            <div class="balance-amount" id="balance-txt">788 REED</div>
        </div>
        
        <div class="coin-container" id="coin-area">
            <div class="interactive-coin" id="main-coin">
                <div style="font-size:11px; letter-spacing:2px; color:#88f2ff; font-weight: bold;">REED TOKEN</div>
