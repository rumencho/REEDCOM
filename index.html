<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Reedcom Network</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 120px; 
            min-height: 100vh;
            user-select: none;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
        }

        /* Коригирано: Само човечето без текст */
        .user-avatar-only {
            font-size: 24px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .connect-wallet-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
        }

        /* Блок Баланс */
        .balance-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 44px;
            font-weight: 800;
            color: #00b4db;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.4);
        }

        /* Централна Зона: Монета */
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
        }

        .interactive-coin {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #172237 0%, #0e1420 100%);
            border: 5px solid #00b4db;
            box-shadow: 0 0 35px rgba(0, 180, 219, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .interactive-coin:active {
            transform: scale(0.92);
        }

        .coin-icon {
            font-size: 50px;
            margin-bottom: 5px;
        }

        .coin-text-top {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #88f2ff;
        }

        .coin-text-bottom {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00b4db;
        }

        /* Коригирано: Блок за новото GitHub Лого на мястото на Енергията */
        .github-logo-container {
            width: 100%;
            max-width: 400px;
            margin: 25px auto 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .github-logo-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 180, 219, 0.2);
            border: 1px solid rgba(0, 180, 219, 0.3);
        }

        /* Фиксирано Долно Меню */
        .bottom-nav {
            position: fixed;
            bottom: 15px; 
            left: 5%;
            width: 90%; 
            height: 65px;
            background-color: #111723;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            width: 25%;
            height: 100%;
            cursor: pointer;
        }

        .nav-item.active {
            color: #00b4db;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- 1. Top Bar (Коригиран: Само икона) -->
    <div class="top-bar" translate="no">
        <div class="user-avatar-only">👤</div>
        <button class="connect-wallet-btn" id="wallet-btn">Connect Wallet</button>
    </div>

    <!-- 2. Блок Баланс -->
    <div class="balance-container" translate="no">
        <div class="balance-label">Your Balance</div>
        <div class="balance-amount" id="balance-txt">788 REED</div>
    </div>

    <!-- 3. Централна Зона: Монета -->
    <div class="coin-container" translate="no">
        <div class="interactive-coin" id="coin">
            <div class="coin-text-top">REED TOKEN</div>
            <div class="coin-icon">🪷</div>
            <div class="coin-text-bottom">COMMUNITY</div>
        </div>
    </div>

    <!-- 4. Блок за Новото Лого (На мястото на Energy Bar) -->
    <div class="github-logo-container" translate="no">
        <img class="github-logo-img" src="coin.jpg.jpg" alt="Reedcom Logo">
    </div>

    <!-- 5. Фиксирано Долно Меню -->
    <nav class="bottom-nav" translate="no">
        <div class="nav-item active" onclick="alert('Tap Menu Clicked')">
            <span class="nav-icon">⚡</span>
            <span>Tap</span>
        </div>
        <div class="nav-item" onclick="alert('Tasks Menu Clicked')">
            <span class="nav-icon">📋</span>
            <span>Tasks</span>
        </div>
        <div class="nav-item" onclick="alert('Friends Menu Clicked')">
            <span class="nav-icon">👥</span>
            <span>Friends</span>
        </div>
        <div class="nav-item" onclick="alert('Profile Menu Clicked')">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
        </div>
    </nav>

    <script>
        const coin = document.getElementById('coin');
        const balanceTxt = document.getElementById('balance-txt');
        let balance = 788;

        coin.addEventListener('click', () => {
            balance += 1;
            balanceTxt.textContent = balance + " REED";
        });

        const walletBtn = document.getElementById('wallet-btn');
        walletBtn.addEventListener('click', () => {
            walletBtn.textContent = "0x7a...2f";
            walletBtn.style.background = "#10b981";
        });
    </script>
</body>
</html>
