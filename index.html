<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REED Community Mini App</title>
    <!-- Tailwind CSS за стилизиране -->
    <script src="https://jsdelivr.net"></script>
    <!-- Telegram Web Apps Telegram SDK -->
    <script src="https://telegram.org"></script>
    <style>
        .neon-glow { text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff; }
        .neon-border { box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans flex flex-col h-screen justify-between overflow-hidden">

    <!-- ЕКРАН 1: HOME (ФАРМЕНЕ И БАЛАНС) -->
    <main id="home-screen" class="flex-1 flex flex-col items-center justify-center p-6 space-y-6">
        <h1 class="text-2xl font-bold tracking-wider text-cyan-400 neon-glow">REED TOKEN</h1>
        
        <!-- Светещото Лого на монетата (тук може да сложите вашата снимка) -->
        <div class="w-48 h-48 rounded-full border-4 border-cyan-400 bg-slate-900 flex items-center justify-center neon-border animate-pulse">
            <span class="text-6xl text-cyan-400">🪷</span>
        </div>

        <div class="text-center">
            <p class="text-gray-400 text-sm uppercase tracking-widest">Вашият Баланс</p>
            <p id="balance-display" class="text-4xl font-extrabold text-white mt-1">0 REED</p>
        </div>

        <button class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold py-3 px-12 rounded-full text-lg transition neon-border w-full max-w-xs">
            Start Farming
        </button>
    </main>

    <!-- ЕКРАН 2: TASKS (СКРИТ ПО ПОДРАЗБИРАНЕ) -->
    <main id="tasks-screen" class="flex-1 flex flex-col p-6 space-y-4 hidden overflow-y-auto">
        <h2 class="text-xl font-bold text-cyan-400 mb-2 neon-glow">Задачи за изпълнение</h2>
        
        <!-- Задача 1: Telegram -->
        <div class="bg-slate-900 p-4 rounded-xl flex items-center justify-between border border-slate-800">
            <div>
                <p class="font-semibold text-sm">Присъедини се в Telegram</p>
                <p class="text-xs text-cyan-400">+500 REED</p>
            </div>
            <button id="btn-tg" onclick="doTelegramTask()" class="bg-cyan-500 text-slate-950 text-xs font-bold py-2 px-4 rounded-lg">Claim</button>
        </div>

        <!-- Задача 2: Twitter (X) -->
        <div class="bg-slate-900 p-4 rounded-xl flex items-center justify-between border border-slate-800">
            <div>
                <p class="font-semibold text-sm">Последвай ни в X (Twitter)</p>
                <p class="text-xs text-cyan-400">+300 REED</p>
            </div>
            <button id="btn-x" onclick="doTwitterTask()" class="bg-cyan-500 text-slate-950 text-xs font-bold py-2 px-4 rounded-lg">Claim</button>
        </div>
    </main>

    <!-- НАВИГАЦИОНЕН ТАСК БАР (МЕНЮ) -->
    <nav class="bg-slate-900 border-t border-slate-800 px-6 py-4 flex justify-around items-center">
        <button onclick="switchScreen('home')" class="flex flex-col items-center space-y-1 focus:outline-none">
            <span class="text-xl">🏠</span>
            <span class="text-xs text-cyan-400">Home</span>
        </button>
        <button onclick="switchScreen('tasks')" class="flex flex-col items-center space-y-1 focus:outline-none">
            <span class="text-xl">📋</span>
            <span class="text-xs text-gray-400">Tasks</span>
        </button>
    </nav>

    <!-- СКРИПТ ЗА ЛОГИКА И СВЪРЗВАНЕ С БЕКЕНДА -->
    <script>
        // Инициализация на Telegram WebApp API
        const tg = window.Telegram.WebApp;
        tg.expand(); // Отваря приложението на цял екран

        // Вземане на реалния ID на потребителя от Telegram
        const userId = tg.initDataUnsafe?.user?.id || 12345; // Стойност по подразбиране, ако се тества в браузър
        const BACKEND_URL = 'https://ВАШИЯТ-БЕКЕНД-URL.com'; // Сменете го с адреса на вашия качен бекенд

        let currentBalance = 0;

        // Зареждане на първоначалните данни при стартиране
        async function loadUserData() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/user-data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });
                const data = await res.json();
                currentBalance = data.balance;
                document.getElementById('balance-display').innerText = `${currentBalance} REED`;
                
                // Промяна на бутоните, ако задачите вече са изпълнени
                if(data.tasks.telegram === 'claimed') updateButton('btn-tg');
                if(data.tasks.twitter === 'claimed') updateButton('btn-x');
            } catch (e) { console.error("Грешка при зареждане на данните"); }
        }

        // Превключване между екраните (Меню)
        function switchScreen(screen) {
            if (screen === 'home') {
                document.getElementById('home-screen').classList.remove('hidden');
                document.getElementById('tasks-screen').classList.add('hidden');
            } else {
                document.getElementById('home-screen').classList.add('hidden');
                document.getElementById('tasks-screen').classList.remove('hidden');
            }
        }

        // Изпълнение на Telegram задачата
        async function doTelegramTask() {
            // Първо го изпращаме да се присъедини
            tg.openTelegramLink('https://t.me');
            
            // Проверяваме след кратко забавяне
            setTimeout(async () => {
                const res = await fetch(`${BACKEND_URL}/api/verify-telegram`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('balance-display').innerText = `${data.newBalance} REED`;
                    updateButton('btn-tg');
                    alert("Успешно взехте 500 REED!");
                } else {
                    alert(data.message);
                }
            }, 2000);
        }

        // Изпълнение на Twitter (X) задачата
        function doTwitterTask() {
            tg.openLink('https://x.com'); // Линк към вашия X
            
            // Симулираме таймер/проверка
            let btn = document.getElementById('btn-x');
            btn.innerText = "Checking...";
            
            setTimeout(async () => {
                const res = await fetch(`${BACKEND_URL}/api/verify-twitter`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });
                const data = await res.json();
                if(data.success) {
                    document.getElementById('balance-display').innerText = `${data.newBalance} REED`;
                    updateButton('btn-x');
                    alert("Успешно взехте 300 REED!");
                }
            }, 5000); // Проверка след 5 секунди
        }

        function updateButton(id) {
            const btn = document.getElementById(id);
            btn.innerText = "Claimed ✓";
            btn.disabled = true;
            btn.className = "bg-gray-700 text-gray-400 text-xs font-bold py-2 px-4 rounded-lg cursor-not-allowed";
        }

        // Стартиране на приложението
        loadUserData();
    </script>
</body>
</html>
