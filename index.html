<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Reedcom Network</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 120px; 
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
        }

        .user-info {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .connect-wallet-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
        }

        /* Блок Баланс */
        .balance-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 44px;
            font-weight: 800;
            color: #00b4db;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.4);
        }

        /* Централна Зона: Монета */
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0;
            position: relative;
        }

        .interactive-coin {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #172237 0%, #0e1420 100%);
            border: 5px solid #00b4db;
            box-shadow: 0 0 35px rgba(0, 180, 219, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .interactive-coin:active {
            transform: scale(0.92);
        }

        .coin-icon {
            font-size: 50px;
            margin-bottom: 5px;
        }

        .coin-text-top {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #88f2ff;
        }

        .coin-text-bottom {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00b4db;
        }

        /* Изскачащ текст +1 */
        .floating-text {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }

        /* Блок Енергия */
        .energy-container {
            width: 100%;
            max-width: 400px;
            margin: 30px auto 0 auto;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .energy-text span strong {
            color: #00ffcc;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00b4db, #00ffcc);
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        /* ДОЛНО МЕНЮ */
        .bottom-nav {
            position: fixed;
            bottom: 15px; 
            left: 5%;
            width: 90%; 
            height: 65px;
            background-color: #111723;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            width: 25%;
            height: 100%;
            cursor: pointer;
        }

        .nav-item.active {
            color: #00b4db;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- 1. Top Bar -->
    <div class="top-bar" translate="no">
        <div class="user-info">👤 @ReedcomUser</div>
        <button class="connect-wallet-btn" id="wallet-btn" onclick="connectWalletMock()">Connect Wallet</button>
    </div>

    <!-- 2. Блок Баланс -->
    <div class="balance-container" translate="no">
        <div class="balance-label">Your Balance</div>
        <div class="balance-amount" id="balance-txt">788 REED</div>
    </div>

    <!-- 3. Централна Зона: Монета -->
    <div class="coin-container" translate="no" id="coin-area">
        <div class="interactive-coin" id="coin">
            <div class="coin-text-top">REED TOKEN</div>
            <div class="coin-icon">🪷</div>
            <div class="coin-text-bottom">COMMUNITY</div>
        </div>
    </div>

    <!-- 4. Блок Енергия -->
    <div class="energy-container" translate="no">
        <div class="energy-text">
            <span>⚡ Energy</span>
            <span><strong id="energy-txt">1000</strong> / 1000</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="energy-bar"></div>
        </div>
    </div>

    <!-- 5. Фиксирано Долно Меню -->
    <nav class="bottom-nav" translate="no">
        <div class="nav-item active" onclick="alert('Главният екран е зареден!')">
            <span class="nav-icon">⚡</span>
            <span>Tap</span>
        </div>
        <div class="nav-item" onclick="alert('Куестовете ще бъдат добавени следващата стъпка!')">
            <span class="nav-icon">📋</span>
            <span>Tasks</span>
        </div>
        <div class="nav-item" onclick="alert('Рефералите ще бъдат добавени следващата стъпка!')">
            <span class="nav-icon">👥</span>
            <span>Friends</span>
        </div>
        <div class="nav-item" onclick="alert('Профилът ще бъде добавен следващата стъпка!')">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
        </div>
    </nav>

    <script>
        let balance = 788;
        let energy = 1000;
        const maxEnergy = 1000;

        const coin = document.getElementById('coin');
        const balanceTxt = document.getElementById('balance-txt');
        const energyTxt = document.getElementById('energy-txt');
        const energyBar = document.getElementById('energy-bar');
        const coinArea = document.getElementById('coin-area');

        // Клик върху монетата
        if(coin) {
            coin.addEventListener('click', (e) => {
                if (energy > 0) {
                    balance += 1;
                    balanceTxt.textContent = balance + " REED";
                    energy -= 1;
                    energyTxt.textContent = energy;
                    energyBar.style.width = (energy / maxEnergy * 100) + "%";

                    // Изскачащ ефект +1
                    const float = document.createElement('div');
                    float.className = 'floating-text';
                    float.textContent = '+1';
                    const rect = coinArea.getBoundingClientRect();
                    let x = e.clientX ? e.clientX - rect.left : rect.width / 2;
                    let y = e.clientY ? e.clientY - rect.top : rect.height / 2;
                    float.style.left = (x - 15) + 'px';
                    float.style.top = (y - 20) + 'px';
                    coinArea.appendChild(float);
                    setTimeout(() => float.remove(), 600);
                }
            });
        }

        // Възстановяване на енергията
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(energy + 3, maxEnergy);
                energyTxt.textContent = energy;
                energyBar.style.width = (energy / maxEnergy * 100) + "%";
            }
        }, 1000);

        // Прост тест за бутона за портфейл
        function connectWalletMock() {
            const btn = document.getElementById('wallet-btn');
            btn.textContent = "OKX: 0x7a...2f";
            btn.style.background = "#10b981";
        }
    </script>
