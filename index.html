<script>
    // Безопасно инициализиране на Telegram WebApp
    const tg = window.Telegram?.WebApp;
    
    // Проверяваме дали приложението действително е отворено ВЪТРЕ в Telegram
    if (tg && tg.initData) {
        try {
            tg.ready();
            tg.expand(); // Разпъва на цял екран в Telegram
        } catch (e) {
            console.log("Telegram SDK е зареден, но има грешка при инициализацията:", e);
        }
    } else {
        console.log("Приложението е стартирано в обикновен браузър (режим за разработка).");
    }

    // Зареждане на състоянието (ако няма localStorage, започва от 0)
    let balance = parseInt(localStorage.getItem('reed_balance')) || 0;
    let energy = parseInt(localStorage.getItem('reed_energy')) || 1000;
    const maxEnergy = 1000;

    // Обновяване на екрана при първо зареждане
    document.getElementById('valBalance').innerText = balance + " REED";
    document.getElementById('valEnergy').innerText = energy;
    document.getElementById('valBar').style.width = (energy / maxEnergy * 100) + "%";
    
    if(localStorage.getItem('wallet_address')) {
        document.getElementById('walletAddress').value = localStorage.getItem('wallet_address');
    }

    // Функция за смяна на табовете (вече работи навсякъде)
    function switchTab(screenId, element) {
        document.querySelectorAll('.view-screen').forEach(screen => {
            screen.classList.remove('visible');
        });
        document.getElementById('screen-' + screenId).classList.add('visible');

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active-tab');
        });
        element.classList.add('active-tab');
    }

    // Функция за кликане върху монетата (КОРИГИРАНО за тестване на компютър и телефон)
    function hitCoin(event) {
        event.preventDefault(); 
        if (energy <= 0) return;

        // Ако тестваме на компютър, използваме клика с мишката, ако е на телефон - докосването
        const touches = event.changedTouches || [event];
        
        for (let i = 0; i < touches.length; i++) {
            if (energy <= 0) break;

            balance += 1;
            energy -= 1;

            const touch = touches[i];
            const clickZone = document.getElementById('clickZone');
            const rect = clickZone.getBoundingClientRect();
            
            // Изчисляване на позицията за изскачащото число +1
            // Поддържа мишка (clientX) и пръст (pageX/clientX)
            const clientX = touch.clientX || event.clientX;
            const clientY = touch.clientY || event.clientY;

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const plus = document.createElement('div');
            plus.classList.add('text-plus');
            plus.innerText = '+1';
            plus.style.left = x + 'px';
            plus.style.top = y + 'px';
            
            clickZone.appendChild(plus);

            setTimeout(() => { plus.remove(); }, 500);
        }

        localStorage.setItem('reed_balance', balance);
        localStorage.setItem('reed_energy', energy);
        
        document.getElementById('valBalance').innerText = balance + " REED";
        document.getElementById('valEnergy').innerText = energy;
        document.getElementById('valBar').style.width = (energy / maxEnergy * 100) + "%";
    }

    // Автоматично възстановяване на Енергия
    setInterval(() => {
        if (energy < maxEnergy) {
            energy = Math.min(maxEnergy, energy + 3);
            localStorage.setItem('reed_energy', energy);
            document.getElementById('valEnergy').innerText = energy;
            document.getElementById('valBar').style.width = (energy / maxEnergy * 100) + "%";
        }
    }, 1000);

    // Запазване на крипто адрес
    function saveWallet() {
        const addr = document.getElementById('walletAddress').value.trim();
        if(addr) {
            localStorage.setItem('wallet_address', addr);
            if (tg && typeof tg.showAlert === 'function') {
                tg.showAlert("Address saved successfully!");
            } else {
                alert("Address saved successfully!");
            }
        }
    }
</script>
