<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Reedcom Network</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 110px; 
            min-height: 100vh;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .user-avatar-only {
            font-size: 22px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .connect-wallet-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
        }

        /* Screens Manager */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* --- SCREEN 1: TAP (HOME) --- */
        .balance-container {
            text-align: center;
            margin-top: 15px;
        }

        .balance-label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 44px;
            font-weight: 800;
            color: #00b4db;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.4);
        }

        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin: 15px 0;
        }

        .interactive-coin {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: radial-gradient(circle, #172237 0%, #0e1420 100%);
            border: 5px solid #00b4db;
            box-shadow: 0 0 35px rgba(0, 180, 219, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .interactive-coin:active {
            transform: scale(0.93);
        }

        .coin-icon {
            font-size: 50px;
            margin-bottom: 5px;
        }

        .coin-text-top {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #88f2ff;
        }

        .coin-text-bottom {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00b4db;
        }

        /* ТОЧНА ПОЗИЦИЯ: Логото стои твърдо НАД плаващото меню на мястото на бара */
        .bottom-logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: auto;
            margin-bottom: 15px; /* Разстояние до долното меню */
        }

        .bottom-logo-img {
            width: 110px; 
            height: 110px;
            border-radius: 50%;
            border: 3px solid #00b4db;
            box-shadow: 0 0 25px rgba(0, 180, 219, 0.4);
            object-fit: cover;
        }

        /* --- ВЪТРЕШНИ ЕКРАНИ --- */
        .screen-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #00b4db;
        }

        .list-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            background: #111723;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-btn {
            background: #1e293b;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Плаващо Долно Меню */
        .bottom-nav {
            position: fixed;
            bottom: 15px; 
            left: 5%;
            width: 90%; 
            height: 65px;
            background-color: #111723;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            width: 25%;
            height: 100%;
            cursor: pointer;
        }

        .nav-item.active {
            color: #00b4db;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- 1. Top Bar -->
    <div class="top-bar" translate="no">
        <div class="user-avatar-only">👤</div>
        <button class="connect-wallet-btn" id="wallet-btn">Connect Wallet</button>
    </div>

    <!-- ТАБ 1: ГЛАВЕН ЕКРАН (TAP) -->
    <div class="screen active" id="screen-tap" translate="no">
        <div class="balance-container">
            <div class="balance-label">Your Balance</div>
            <div class="balance-amount" id="balance-txt">788 REED</div>
        </div>

        <div class="coin-container">
            <div class="interactive-coin" id="coin">
                <div class="coin-text-top">REED TOKEN</div>
                <div class="coin-icon">🪷</div>
                <div class="coin-text-bottom">COMMUNITY</div>
            </div>
        </div>
    </div>

    <!-- ТАБ 2: ЗАДАЧИ (TASKS) -->
    <div class="screen" id="screen-tasks" translate="no">
        <h2 class="screen-title">Tasks for Coins</h2>
        <div class="list-container">
            <div class="list-item">
                <div>
                    <div>Join Telegram Channel</div>
                    <small style="color: #00ffcc;">+100 REED</small>
                </div>
                <button class="item-btn">Start</button>
            </div>
            <div class="list-item">
                <div>
                    <div>Follow X (Twitter)</div>
                    <small style="color: #00ffcc;">+150 REED</small>
                </div>
                <button class="item-btn">Start</button>
            </div>
        </div>
    </div>

    <!-- ТАБ 3: ПРИЯТЕЛИ (FRIENDS) -->
    <div class="screen" id="screen-friends" translate="no">
        <h2 class="screen-title">Invite Friends</h2>
        <div class="list-container" style="text-align: center;">
            <p style="color: #94a3b8; margin-bottom: 15px;">Earn 10% of your friends' token claims!</p>
            <button class="connect-wallet-btn" style="width: 100%; max-width: 250px; margin: 0 auto; padding: 12px;">Copy Invite Link</button>
        </div>
    </div>

    <!-- ТАБ 4: ПРОФИЛ (PROFILE) -->
    <div class="screen" id="screen-profile" translate="no">
        <h2 class="screen-title">User Profile</h2>
        <div class="list-container">
            <div class="list-item">
                <span>Rank Status</span>
                <strong style="color: #00b4db;">Bronze Member</strong>
            </div>
            <div class="list-item">
                <span>Total Clicks</span>
                <strong id="total-clicks-txt">0</strong>
            </div>
        </div>
    </div>

    <!-- Коригирано позициониране: Винаги НАД долното меню, извън екраните -->
    <div class="bottom-logo-container" translate="no">
        <img class="bottom-logo-img" src="coin.jpg.jpg" alt="Reedcom Coin Logo">
    </div>

    <!-- 5. Плаващо Долно Меню -->
    <nav class="bottom-nav" translate="no">
        <div class="nav-item active" data-target="screen-tap">
            <span class="nav-icon">⚡</span>
            <span>Tap</span>
        </div>
        <div class="nav-item" data-target="screen-tasks">
            <span class="nav-icon">📋</span>
            <span>Tasks</span>
        </div>
        <div class="nav-item" data-target="screen-friends">
            <span class="nav-icon">👥</span>
            <span>Friends</span>
        </div>
        <div class="nav-item" data-target="screen-profile">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
        </div>
    </nav>

    <script>
        let balance = 788;
        let totalClicks = 0;

        const coin = document.getElementById('coin');
        const balanceTxt = document.getElementById('balance-txt');
