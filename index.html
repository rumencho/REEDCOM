<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reedcom Network</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; user-select: none; text-align: center; padding: 16px; padding-bottom: 110px; }
        
        .page-screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page-screen.active { display: flex; }
        
        .top-bar { display: flex; justify-content: center; width: 100%; margin-bottom: 20px; margin-top: 10px; min-height: 50px; }
        
        .custom-wallet-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white; border: none; padding: 12px 24px; border-radius: 25px;
            font-size: 14px; font-weight: bold; cursor: pointer; width: 85%;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
            transition: all 0.2s;
        }
        
        .balance-container { text-align: center; margin-bottom: 20px; width: 100%; }
        .balance-amount { font-size: 44px; font-weight: bold; color: #00b4db; margin-top: 5px; }
        
        .coin-container { display: flex; justify-content: center; margin: 25px 0; width: 100%; position: relative; }
        .interactive-coin { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #172237 0%, #0e1420 100%); border: 5px solid #00b4db; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 30px rgba(0, 180, 219, 0.4); transition: transform 0.05s; }
        .interactive-coin:active { transform: scale(0.95); }
        
        .energy-container { width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 12px; margin-top: 20px; }
        .progress-bar-bg { width: 100%; height: 12px; background-color: #1e293b; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #00b4db, #00ffcc); width: 100%; }
        
        .floating-text { position: absolute; font-size: 32px; font-weight: bold; color: #00ffcc; pointer-events: none; animation: floatUp 0.6s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } }

        .bottom-nav { position: fixed; bottom: 15px; left: 5%; width: 90%; height: 65px; background-color: #111723; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; display: flex; justify-content: space-around; align-items: center; z-index: 99999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 12px; font-weight: bold; cursor: pointer; width: 25%; }
        .nav-item.active-nav { color: #00b4db; }
    </style>
</head>
<body>

    <!-- ЕКРАН 1: TAP -->
    <div id="screen-tap" class="page-screen active">
        <div class="top-bar">
            <button class="custom-wallet-btn" id="main-wallet-btn" onclick="executeConnect()">Connect Wallet</button>
        </div>
        <div class="balance-container">
            <div style="color: #94a3b8; font-size: 13px;">YOUR BALANCE</div>
            <div class="balance-amount" id="balance-txt">788 REED</div>
        </div>
        <div class="coin-container" id="coin-area">
            <div class="interactive-coin" onclick="clickCoin(event)">
                <div style="font-size:11px; color:#88f2ff; font-weight: bold;">REED TOKEN</div>
                <div style="font-size:45px; margin: 10px 0;">🪙</div>
                <div style="font-size:13px; color:#00b4db; font-weight: bold;">COMMUNITY</div>
            </div>
        </div>
        <div class="energy-container">
            <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #94a3b8;">
                <span>⚡ Energy</span><span><strong id="energy-txt">1000</strong> / 1000</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="energy-bar"></div></div>
        </div>
    </div>

    <!-- ЕКРАН 2: PROFILE -->
    <div id="screen-profile" class="page-screen">
        <div style="background: rgba(255, 255, 255, 0.02); padding: 30px; border-radius: 20px; margin-top: 40px; width: 100%; max-width: 400px;">
            <div style="font-size: 22px; color: #00b4db; font-weight: bold; margin-bottom: 10px;">👤 Профил</div>
            <div id="profile-wallet-status" style="font-size: 14px; color: #94a3b8; word-break: break-all;">Портфейл: Не е свързан</div>
        </div>
    </div>

    <!-- МЕНЮ -->
    <nav class="bottom-nav">
        <div onclick="changeTab('screen-tap', this)" class="nav-item active-nav"><span>⚡</span><span>Tap</span></div>
        <div onclick="changeTab('screen-profile', this)" class="nav-item"><span>👤</span><span>Profile</span></div>
    </nav>

    <script>
        // Зареждане на запазените точки от паметта на браузъра (за да не се губят)
        let score = localStorage.getItem('reed_score') ? parseInt(localStorage.getItem('reed_score')) : 788;
        let pwr = 1000;
        const maxPwr = 1000;
        let isConnected = false;

        // Показване на първоначалния баланс
        document.getElementById('balance-txt').textContent = score + " REED";

        function changeTab(id, el) {
            document.querySelectorAll('.page-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active-nav'));
            el.classList.add('active-nav');
        }

        function clickCoin(e) {
            if (pwr > 0) {
                score++;
                pwr--;
                
                // Запазваме точките в реално време в браузъра
                localStorage.setItem('reed_score', score);
                
                document.getElementById('balance-txt').textContent = score + " REED";
                document.getElementById('energy-txt').textContent = pwr;
                document.getElementById('energy-bar').style.width = (pwr / maxPwr * 100) + "%";

                if (e && e.clientX) {
                    let float = document.createElement('div');
                    float.className = 'floating-text';
                    float.textContent = '+1';
                    let rect = document.getElementById('coin-area').getBoundingClientRect();
                    float.style.left = (e.clientX - rect.left - 15) + 'px';
                    float.style.top = (e.clientY - rect.top - 20) + 'px';
                    document.getElementById('coin-area').appendChild(float);
                    setTimeout(() => float.remove(), 600);
                }
            }
        }

        setInterval(() => {
            if (pwr < maxPwr) {
                pwr = Math.min(pwr + 5, maxPwr);
                document.getElementById('energy-txt').textContent = pwr;
                document.getElementById('energy-bar').style.width = (pwr / maxPwr * 100) + "%";
            }
        }, 1000);

        // СУПЕР СТАБИЛНА СИМУЛАЦИЯ, КОЯТО НИКОГА НЕ СЕ ЧУПИ
        function executeConnect() {
            const btn = document.getElementById('main-wallet-btn');
            const status = document.getElementById('profile-wallet-status');
            
            if (!isConnected) {
                btn.textContent = "Свързване...";
                setTimeout(() => {
                    isConnected = true;
                    btn.textContent = "Disconnect (UQBs...Reed)";
                    btn.style.background = "#10b981"; // Зелено
                    if(status) status.textContent = "Портфейл: UQBsA1Xyz987_Reedcom_Network_Connected";
                }, 400);
            } else {
                isConnected = false;
                btn.textContent = "Connect Wallet";
                btn.style.background = "linear-gradient(135deg, #00b4db, #0083b0)"; // Синьо
                if(status) status.textContent = "Портфейл: Не е свързан";
            }
        }
    </script>
</body>
</html>
