<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reedcom Network - Clicker</title>
    
    <!-- Официален скрипт на Telegram за Mini Apps -->
    <script src="https://telegram.org"></script>
    
    <style>
        body {
            background-color: #0d121d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .game-container {
            max-width: 400px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .airdrop-badge {
            background: linear-gradient(135deg, #f3ba2f 0%, #f0a500 100%);
            color: #0d121d;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .balance-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .balance-label {
            font-size: 14px;
            color: #8a99ad;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: #00d2ff;
            margin-top: 5px;
        }
        .clicker-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }
        .coin-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .coin-btn:active {
            transform: scale(0.95);
        }
        .lotus-svg {
            width: 180px;
            height: 180px;
            fill: #00d2ff;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.6));
        }
        .energy-container {
            width: 100%;
            margin-bottom: 25px;
        }
        .energy-bar {
            width: 100%;
            height: 12px;
            background-color: #1c2c3e;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .energy-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00d2ff, #00ffaa);
        }
        .wallet-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
            text-align: center;
        }
        .wallet-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #f3ba2f;
            letter-spacing: 0.5px;
        }
        .wallet-input-container {
            display: flex;
            gap: 8px;
        }
        .wallet-input {
            flex: 1;
            background-color: #16222f;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
        }
        .wallet-input::placeholder {
            color: #56667a;
        }
        .btn-save {
            background-color: #00d2ff;
            color: #0d121d;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .tasks-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .task-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .task-btn {
            background-color: #1c2c3e;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div style="font-weight: bold; letter-spacing: 1px;">REEDCOM NETWORK</div>
        <div class="airdrop-badge">🎁 AIRDROP PHASE</div>
    </div>

    <div class="balance-container">
        <div class="balance-label">Your Balance</div>
        <div class="balance-amount" id="balanceDisplay">0</div>
    </div>

    <!-- Секция за въвеждане на адрес -->
    <div class="wallet-section">
        <div class="wallet-title">Submit BSC Wallet Address</div>
        <div class="wallet-input-container">
            <input type="text" id="walletInput" class="wallet-input" placeholder="Paste 0x... address from Binance/MetaMask">
            <button class="btn-save" onclick="saveWalletAddress()">Save</button>
        </div>
    </div>

    <div class="clicker-container">
        <!-- Върнат класически onclick за максимална съвместимост -->
        <button class="coin-btn" onclick="handleTap(event)">
            <svg class="lotus-svg" viewBox="0 0 100 100">
                <path d="M50,85 C40,70 30,55 35,40 C40,25 50,15 50,15 C50,15 60,25 65,40 C70,55 60,70 50,85 Z"/>
                <path d="M50,85 C35,75 20,60 20,45 C20,30 35,25 40,35 C45,45 48,65 50,85 Z"/>
                <path d="M50,85 C65,75 80,60 80,45 C80,30 65,25 60,35 C55,45 52,65 50,85 Z"/>
                <path d="M50,85 C25,80 10,65 15,50 C20,35 35,40 40,50 C45,60 48,75 50,85 Z"/>
                <path d="M50,85 C75,80 90,65 85,50 C80,35 65,40 60,50 C55,60 52,75 50,85 Z"/>
            </svg>
        </button>
    </div>

    <div class="energy-container">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
            <span>⚡ Energy</span>
            <span id="energyText">1000/1000</span>
        </div>
        <div class="energy-bar">
            <div class="energy-fill" id="energyFill"></div>
        </div>
    </div>

    <div class="tasks-container">
        <div style="font-weight: bold; margin-bottom: 10px;">Tasks for Coins</div>
        <div class="task-row">
            <span>Join Telegram</span>
            <a href="https://t.me/+1H6v9c3U3lM3ZTBk" target="_blank" class="task-btn" onclick="claimTask(100)">+100 RC</a>
        </div>
    </div>
</div>

<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    // ЗАЩИТА ПРОТИВ NaN: Четем паметта и ако стойността е счупена, автоматично я превръщаме в 0
    let score = parseInt(localStorage.getItem("reedcom_score"));
    if (isNaN(score)) {
        score = 0;
        localStorage.setItem("reedcom_score", 0);
    }

    let energy = parseInt(localStorage.getItem("reedcom_energy"));
    if (isNaN(energy)) {
        energy = 1000;
        localStorage.setItem("reedcom_energy", 1000);
    }

    let savedAddress = localStorage.getItem("reedcom_wallet") || "";

    // Показване на чистите данни
    document.getElementById("balanceDisplay").innerText = score;
    if (savedAddress) {
        document.getElementById("walletInput").value = savedAddress;
    }
    updateUI();

    function handleTap(event) {
        if (energy >= 1) {
            score += 1;
            energy -= 1;
            updateUI();
            localStorage.setItem("reedcom_score", score);
            localStorage.setItem("reedcom_energy", energy);
            createFloatingText(event);
        }
    }

    function updateUI() {
        document.getElementById("balanceDisplay").innerText = score;
        document.getElementById("energyText").innerText = energy + "/1000";
        document.getElementById("energyFill").style.width = (energy / 10) + "%";
    }

    setInterval(() => {
        if (energy < 1000) {
            energy += 1;
            updateUI();
            localStorage.setItem("reedcom_energy", energy);
        }
    }, 1000);

    function claimTask(reward) {
        score += reward;
        updateUI();
        localStorage.setItem("reedcom_score", score);
    }

    function saveWalletAddress() {
        const address = document.getElementById("walletInput").value.trim();
        if (address === "") {
            alert("Please enter an address!");
            return;
        }
        if (!address.startsWith("0x") || address.length < 40) {
            alert("Please enter a valid BSC address starting with 0x!");
            return;
        }
        localStorage.setItem("reedcom_wallet", address);
        alert("Wallet address saved successfully for the Airdrop!");
    }

    function createFloatingText(e) {
        const text = document.createElement("div");
        text.innerText = "+1";
        text.style.position = "fixed";
        
        let clientX = e.clientX || (window.innerWidth / 2);
        let clientY = e.clientY || (window.innerHeight / 2 - 50);

        text.style.left = clientX + "px";
        text.style.top = clientY + "px";
        text.style.color = "#00d2ff";
        text.style.fontWeight = "bold";
        text.style.pointerEvents = "none";
        text.style.zIndex = "9999";
        text.style.transition = "transform 0.5s ease-out, opacity 0.5s";
        
        document.body.appendChild(text);
        
        setTimeout(() => {
